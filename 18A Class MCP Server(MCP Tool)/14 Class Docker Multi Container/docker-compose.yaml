services:
  backend:
    build: ./backend-fastapi
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend-fastapi:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./backend-fastapi
          target: /app
    restart: unless-stopped

  frontend:
    build: ./frontend-nextjs
    container_name: nextjs-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-nextjs:/app
      - /app/node_modules
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./frontend-nextjs
          target: /app
    restart: unless-stopped

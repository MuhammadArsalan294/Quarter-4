services:
  nextjs:
    build:
      context: .
      target: builder
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
        - action: rebuild
          path: package.json
    environment:
      - NODE_ENV=development
    command: npm run dev -- --turbopack

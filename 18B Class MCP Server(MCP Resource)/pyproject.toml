[project]
name = "fastapi-starter"
version = "0.1.0"
description = "A simple FastAPI starter project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncio>=4.0.0",
    "fastapi",
    "fastmcp>=3.2.4",
    "rich>=15.0.0",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
